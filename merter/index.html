<title>Merter Çınar Evleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a building notice board. Sticky header ends in a row of lit windows; each module closes with a door-plate block. */
:root{
  --paper:#F4F6F5; --sheet:#FFFFFF; --ink:#18221F; --muted:#56635F; --line:#D5DDDA;
  --accent:#1F6B5A; --accent-soft:#E2F0EB; --grid:rgba(31,107,90,.05); --weld:#C08A1E; --weld-soft:#F7EDD6;
  --ok:#2B7A4B; --ok-soft:#E1F1E7; --warn:#A35F00; --warn-soft:#FBEEDB;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --sheet:#16201D; --ink:#E4ECE9; --muted:#93A39E; --line:#27342F;
  --accent:#6CC4A8; --accent-soft:#16302A; --grid:rgba(108,196,168,.05); --weld:#E2B04E; --weld-soft:#33280F;
  --ok:#62C48D; --ok-soft:#14301F; --warn:#E6A84E; --warn-soft:#33250F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1513; --sheet:#16201D; --ink:#E4ECE9; --muted:#93A39E; --line:#27342F;
  --accent:#6CC4A8; --accent-soft:#16302A; --grid:rgba(108,196,168,.05); --weld:#E2B04E; --weld-soft:#33280F;
  --ok:#62C48D; --ok-soft:#14301F; --warn:#E6A84E; --warn-soft:#33250F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:6px 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:880px;margin:0 auto}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px)) 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:880px;margin:0 auto}
.brand h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 22px/1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand h1 span{color:var(--accent)}
.tape{height:12px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background-color:var(--weld-soft);background-color:var(--accent-soft);background-image:repeating-linear-gradient(90deg,transparent 0 6px,var(--weld) 6px 14px,transparent 14px 20px,var(--line) 20px 28px,transparent 28px 34px);background-size:100% 6px;background-position:0 3px;background-repeat:repeat-x;border-top:1px solid var(--line)}
.brand .sync{font:12px var(--f-mono);color:var(--muted);text-align:right}
nav.tabs{display:flex;max-width:880px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:1 0 auto;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;align-items:end;margin-top:6px}
.pgrid select{width:100%;font:14px var(--f-body);padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin-top:6px}
.pgrid.birey{padding:8px 0;border-top:1px dashed var(--line)}
nav.tabs a{text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:9px 4px 10px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:20px 48px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2.title{font:800 clamp(28px,7vw,40px)/1.05 var(--f-display);letter-spacing:-.015em;margin:4px 0 10px;text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin:0 0 18px}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.summary div{background:var(--sheet);padding:10px 12px}
.summary b{display:block;font:800 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}

/* map */
.phase{margin:0 0 22px}
.phase h3{display:flex;gap:10px;align-items:baseline;font:700 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}
.phase h3 em{font-style:normal;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit;
  background:var(--sheet);border:1px solid var(--line);outline:1.5px dashed var(--line);outline-offset:-6px;padding:14px;min-width:0}
.card:hover{border-color:var(--accent);outline-color:var(--accent)}
.card code{font:500 13px var(--f-mono);color:var(--accent)}
.card .t{font-weight:600;line-height:1.3;min-width:0}
.card .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.score{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.score.empty{color:var(--line)}
.bar{grid-column:1/-1;height:4px;background:var(--accent-soft)}
.bar i{display:block;height:100%;background:var(--accent)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font:500 12px var(--f-mono);padding:3px 8px;border:1px solid var(--line);background:var(--sheet);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* picker */
.picker{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:6px 0}
.picker button{font:600 14px var(--f-body);font-variant-numeric:tabular-nums;padding:8px 0;min-height:36px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.picker button.on{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.picker button.fill{background:var(--accent-soft)}
.lvl{font-size:13px;color:var(--muted)}
.lvl b{color:var(--ink)}
.row{background:var(--sheet);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.row .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .head a{font-weight:600;text-decoration:none;color:var(--ink)}
.row .head code{font:500 13px var(--f-mono);color:var(--accent);margin-right:6px}
.row input{width:100%;font:14px var(--f-body);padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin-top:6px}
.note{font-size:13px;color:var(--warn);margin:6px 0 0}
.btn{font:600 14px var(--f-body);padding:9px 14px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.btn.danger{color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* module doc */
.scorebox{background:var(--sheet);border:1px solid var(--line);padding:12px;margin:0 0 18px}
.doc{min-width:0}
.doc h1{display:none}
.doc h2{font:800 22px/1.2 var(--f-display);margin:28px 0 8px;padding-top:10px;border-top:1.5px dashed var(--accent)}
.doc h3{font-size:17px;margin:0}
.doc h4{font-size:15px;margin:18px 0 6px}
.doc p,.doc li{max-width:68ch}
.doc details{background:var(--sheet);border:1px solid var(--line);margin:8px 0}
.doc details>summary{cursor:pointer;padding:12px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.doc details>summary::-webkit-details-marker{display:none}
.doc details>summary::after{content:"+";font:500 18px/1 var(--f-mono);color:var(--accent)}
.doc details[open]>summary::after{content:"−"}
.doc details>.body{padding:0 12px 12px;border-top:1px solid var(--line)}
.doc code{font:13px var(--f-mono);background:var(--accent-soft);padding:1px 4px}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;background:var(--sheet)}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line)}
.tbl th{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--paper)}
.tbl td{min-width:9ch}
.pending{background:var(--sheet);border:1px dashed var(--line);padding:18px;color:var(--muted)}

/* title block */
.titleblock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--ink);border-radius:2px;margin-top:28px;font:12px var(--f-mono);background:var(--sheet)}
.titleblock div{padding:8px;border-right:1px solid var(--ink);min-width:0}
.titleblock div:last-child{border-right:0}
.titleblock span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:520px){.titleblock{grid-template-columns:repeat(2,minmax(0,1fr))}.titleblock div:nth-child(2){border-right:0}.titleblock div:nth-child(-n+2){border-bottom:1px solid var(--ink)}
  .summary b{font-size:24px}.picker button{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.card,.picker button{transition:border-color .15s,background .15s}}

/* ---- sakin arayüzü ---- */
body{font-size:16px}
.ik{width:22px;height:22px;flex:none}.ik.acc{color:var(--accent)}.ik.go{margin-left:auto;color:var(--muted)}
.hello{margin:4px 0 14px}.hello .title{margin-bottom:4px}.hello .lead{margin:0}
.hcard{display:block;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;color:var(--ink);text-decoration:none}
a.hcard:active{transform:scale(.995)}a.hcard:hover{border-color:var(--accent)}
.hhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}.hhead h3{font:700 17px/1.2 var(--f-display);margin:0}
.hcard .big{font:700 18px/1.3 var(--f-body);margin:6px 0 2px}.hcard .meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin:2px 0 0}.hcard .meta .ik{width:16px;height:16px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px}
.duyuru{background:var(--weld-soft);border-color:transparent}.duyuru p{margin:0;font-size:16px}
.onb{border:2px solid var(--accent)}.onb h3{font:700 19px var(--f-display);margin:0 0 10px}
.steps{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:12px}.steps li{display:flex;gap:12px;align-items:flex-start}.steps b{display:block}.steps small{color:var(--muted);font-size:14px}
.num{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--sheet);font-weight:700;flex:none}
.cta{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:12px;background:var(--accent);color:var(--sheet);font-weight:700;text-decoration:none;font-size:17px}
.tels{list-style:none;margin:6px 0 0;padding:0}.tels li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tels output{font:500 15px var(--f-mono);user-select:all}.mini{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.mods{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}.mods li{display:flex;gap:8px;align-items:center;font-size:15px}.mods code{font:500 12px var(--f-mono);color:var(--accent)}.mods .pill{margin-left:auto}
.ev{display:flex;gap:14px}.evdate{flex:none;width:56px;text-align:center;border-radius:12px;background:var(--accent-soft);padding:8px 0;align-self:flex-start}.evdate b{display:block;font:800 24px/1 var(--f-display);color:var(--accent)}.evdate span{font-size:12px;text-transform:uppercase;color:var(--muted)}
.evbody{flex:1;min-width:0}.evbody h3{font:700 18px/1.25 var(--f-display);margin:6px 0 2px}
.evact{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px}.evact select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;padding:0 8px;margin-top:4px}
.evact input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;padding:0 10px;width:100%;margin-top:4px}
.btn.pri{background:var(--accent);color:var(--sheet);border-color:var(--accent)}.mini.lnk{display:inline-flex;align-items:center;text-decoration:none}
.pill.ok{background:var(--ok-soft);color:var(--ok);display:inline-flex;gap:4px;align-items:center}.pill.ok .ik{width:14px;height:14px}
.pbtn{border:0;cursor:pointer;font:600 13px var(--f-body);min-height:36px}.pbtn[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}
table.lig td,table.lig th{padding:6px 8px;text-align:center;min-width:0}table.lig td:nth-child(2),table.lig th:nth-child(2){text-align:left}table.lig tr.biz td{background:var(--accent-soft);font-weight:700}
.mac{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}.mac span:last-of-type{text-align:right}.mac small{grid-column:1/-1;color:var(--muted);font-size:12px;text-align:center}
.row details ul{margin:6px 0 0;padding-left:18px}
.bugun .hhead .tarih,.hhead .tarih{margin-left:auto;font-size:12px;color:var(--muted)}.bugun .hhead .tarih+.go{margin-left:6px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.bgrid>div{background:var(--paper);border-radius:12px;padding:10px}.bgrid small{display:block;font-size:12px;color:var(--muted)}.bgrid b{display:block;font:800 20px/1.2 var(--f-display)}.bgrid span{font-size:13px;color:var(--muted)}
.vakit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.vakit div{background:var(--paper);border-radius:12px;padding:8px;text-align:center}.vakit div.on{background:var(--accent);color:var(--sheet)}.vakit small{display:block;font-size:12px;opacity:.8}.vakit b{font:800 19px var(--f-display);font-variant-numeric:tabular-nums}
@media (min-width:520px){.vakit{grid-template-columns:repeat(6,minmax(0,1fr))}}
.giyim{list-style:none;margin:0;padding:0;display:grid;gap:6px}.giyim li{display:flex;gap:8px;align-items:flex-start}.giyim .ik{width:18px;height:18px;color:var(--ok);margin-top:2px}
.hgun{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:12px;overflow-x:auto}.hgun div{text-align:center;background:var(--paper);border-radius:10px;padding:6px 2px;min-width:0}.hgun small{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hgun b{display:block;font:800 17px var(--f-display)}.hgun span{font-size:12px;color:var(--muted)}
.hkk{position:relative;border-radius:20px;overflow:hidden;margin:0 0 14px;color:#fff;isolation:isolate;box-shadow:0 10px 28px rgba(0,0,0,.22);min-height:300px;display:flex}
.hksahne{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hkperde{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.35) 38%,rgba(0,0,0,.72) 100%)}
.hkic{margin-top:auto;padding:18px 18px 14px;width:100%;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.hkrozet{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 10px}
.hkar{font:400 clamp(24px,6.6vw,32px)/1.9 "Amiri","Noto Naskh Arabic","Traditional Arabic","Scheherazade New",serif;margin:12px 0 8px;text-align:center;overflow-wrap:anywhere}
.hktr{font-size:16px;line-height:1.55;margin:0 0 6px;text-align:center}.hkkay{font:500 12px var(--f-mono);letter-spacing:.04em;text-align:center;opacity:.9;margin:0 0 10px}
.hkak,.hkgez{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.hkgez{justify-content:flex-start;margin-top:4px}
.hkk .lk{color:#fff;background:rgba(255,255,255,.16);border-radius:50%;min-width:44px}.hkk .lk.on{color:#ff6b8a}.hkk .mini{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);text-shadow:none}
.hkk .wa{background:rgba(31,143,78,.92)}.hkk .wa span{text-shadow:none}
.hkhero .hkk{min-height:340px}
@media (prefers-reduced-motion:no-preference){.hkk .hksahne{animation:hkz 40s ease-in-out infinite alternate}@keyframes hkz{from{transform:scale(1)}to{transform:scale(1.08)}}}
.hkdv{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}.hkdv[hidden]{display:none}
.hkdvk{background:var(--sheet);color:var(--ink);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.hkdvb{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hkdvr{display:flex;justify-content:center;align-items:center;min-height:120px;margin:10px 0}.hkdvr img{max-height:52vh;max-width:100%;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.turlar{display:grid;gap:8px;margin-top:10px}.tur{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--paper)}.tur.on{border-color:var(--accent);background:var(--accent-soft)}.tur.kapali{opacity:.55;cursor:default}.tur input{margin-top:4px;width:20px;height:20px;accent-color:var(--accent);flex:none}.tur span{display:flex;flex-direction:column;min-width:0}.tur small{color:var(--muted);font-size:13px}
.toplama{display:flex;gap:6px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:8px 0 0;font-size:14px}.toplama .ik{width:16px;height:16px;color:var(--accent);flex:none}
.randevu{display:flex;gap:6px;align-items:center;background:var(--ok-soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}.randevu .ik{width:16px;height:16px;color:var(--ok)}
.row .head .ik{width:16px;height:16px;vertical-align:-2px}
.hbts{display:flex;gap:8px;margin-left:auto;align-items:center}
@media (max-width:719px){.bnav a{font-size:11px;padding:0 1px}.bnav a span{white-space:nowrap}}
.ok-sahne{perspective:900px;display:flex;justify-content:center;margin:6px 0 16px}
.oyunkart{--c1:#C9A227;--c2:#F6E08A;position:relative;width:min(100%,340px);border-radius:22px;padding:16px 16px 12px;color:#fff;overflow:hidden;
 background:radial-gradient(120% 80% at 20% 0%,color-mix(in srgb,var(--c2) 35%,transparent),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--c1) 55%,#0b1210),#0b1210 78%);
 box-shadow:0 0 0 2px var(--c1),0 0 0 5px color-mix(in srgb,var(--c2) 45%,transparent),0 18px 40px rgba(0,0,0,.35)}
.oyunkart::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.04) 14px 15px);pointer-events:none}

  try{

    const uid=user?await user.id():null;
    if(!db||!uid) return;
    docRef=db.doc("data/users/"+uid+"/kart");
    const snap=await docRef.get();
    if(snap.exists){const d=snap.data();state={scores:{...(d.scores||{})},kanit:{...(d.kanit||{})}};lsSet()}
    else if(Object.keys(state.scores).length){await docRef.set({...state,updatedAt:Date.now()})}
    mode="db"; setSync("Hesabına kaydediliyor · tüm cihazlar"); render();
    initProfil(db,user,uid);
  }catch(e){docRef=null; mode="local"; setSync("Bu cihazda kaydediliyor")}
}
function queueSave(){
  lsSet(); if(mode!=="db") return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); setSync("Kaydediliyor…");
}
async function flush(){
  if(saving){pendingSave=true;return}
  saving=true;
  try{await docRef.set({scores:state.scores,kanit:state.kanit,updatedAt:Date.now()});setSync("Hesabına kaydedildi · tüm cihazlar")}
  catch(e){mode="local";docRef=null;setSync("Bu cihazda kaydediliyor")}
  saving=false; if(pendingSave){pendingSave=false;flush()}
}

function sc(c){return state.scores[c]||0}
function preStatus(m){const miss=m.pre.filter(p=>sc(p)<4);return miss}
function stats(){
  const vals=aktifM().map(m=>sc(m.code)).filter(Boolean);
  const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  const low=aktifM().filter(m=>sc(m.code)).sort((a,b)=>sc(a.code)-sc(b.code)).slice(0,3);
  return {n:vals.length,avg,low};
}
function picker(code){
  const s=sc(code);
  return `<div class="picker" role="group" aria-label="${code} puanı">`+
    Array.from({length:10},(_,i)=>{const v=i+1;return `<button type="button" data-set="${code}" data-v="${v}" class="${v===s?"on":v<s?"fill":""}" aria-pressed="${v===s}">${v}</button>`}).join("")+`</div>`;
}
function warn7(code){
  const s=sc(code); if(s>=7 && !(state.kanit[code]||"").trim()) return `<p class="note">7 ve üzeri puan yalnızca bir site görevindeki kanıtla verilir. Kanıtı aşağıya yaz (ör. ${BY[code].proj[0]}: rapor, tutanak, hesap tablosu).</p>`;
  return "";
}

const docs={};
async function loadMd(file){
  if(docs[file]!==undefined) return docs[file];
  try{const r=await fetch("md/"+file); docs[file]=r.ok?await r.text():null}catch(e){docs[file]=null}
  return docs[file];
}
function renderMd(md,el){
  el.innerHTML=marked.parse(md);
  el.querySelectorAll("table").forEach(t=>{const d=document.createElement("div");d.className="tbl";t.replaceWith(d);d.appendChild(t)});
  [...el.querySelectorAll("h3")].forEach(h=>{
    const det=document.createElement("details"),sum=document.createElement("summary"),body=document.createElement("div");
    body.className="body"; const h3=document.createElement("h3"); h3.innerHTML=h.innerHTML; sum.appendChild(h3); det.append(sum,body);
    let n=h.nextSibling; while(n&&!(n.nodeType===1&&/^H[1-3]$/.test(n.tagName))){const nx=n.nextSibling;body.appendChild(n);n=nx}
    h.replaceWith(det);
  });
}

function ayarEvent(e){
  const t=e.target,a=ayDraft;if(!a)return false;
  const redraw=()=>{if(e.type==="change"&&(t.tagName==="SELECT"||t.type==="checkbox")){try{const ae=document.activeElement;if(ae&&ae!==t&&ae.matches("input:not([type=checkbox]),textarea"))ae.blur()}catch(_){}const y=window.scrollY;render(false);window.scrollTo(0,y)}else{const s=document.getElementById("ayStatus");if(s)s.textContent="Kaydedilmemiş değişiklik var"}};
  if(t.dataset.ay){a[t.dataset.ay]=t.type==="checkbox"?t.checked:t.value;ayDirty=true;ayStatus="";if(t.dataset.ay==="tema"&&e.type==="change"){const keep=AYAR;AYAR={...AYAR,tema:t.value};applyAyar();AYAR=keep}redraw();return true}

function kategoriler(p,ozel){
  const b=p.bireyler||[],out=[];
  if(p.durum) out.push(p.durum);
  out.push(b.length===1?"Tek kişilik hane":b.length>=5?`Kalabalık hane (${b.length})`:`${b.length} kişilik hane`);
  if(b.some(x=>x.yas==="0–6")) out.push("Küçük çocuklu (0–6)");

  if(b.some(x=>x.is==="Öğrenci")) out.push("Öğrenci var");

function onerilenYol(p){

  if(+p.tasinma>=BUYIL-1) y.push("Y02","Y03","Y01");
  if(p.durum==="Kiracı") y.push("Y03","Y05","Y11");
  if(p.durum==="Malik") y.push("Y01","Y04","Y07","Y08");
  if(p.durum==="Malik yakını") y.push("Y01","Y03","Y04");
  if(p.yardim||b.some(x=>x.yas==="0–6"||x.yas==="7–17"||x.yas==="65+")) y.push("Y06");

}

function profilEvent(e){
  const t=e.target;
  if(t.dataset.pf){const f=t.dataset.pf;pDraft[f]=t.type==="checkbox"?t.checked:t.value;if(f==="blok"&&t.tagName==="SELECT"){pDraft.kat="";pDraft.daire=""}pDirty=true;pStatus="";
    if(e.type==="change"&&(t.tagName==="SELECT"||t.type==="checkbox")){try{const ae=document.activeElement;if(ae&&ae!==t&&ae.matches("input:not([type=checkbox]),textarea"))ae.blur()}catch(_){}const y=window.scrollY;render(false);window.scrollTo(0,y)}
    else{const s=document.getElementById("pStatus");if(s)s.textContent="Kaydedilmemiş değişiklik var"}return true}
  if(t.dataset.ek){pDraft.ek=pDraft.ek||{};pDraft.ek[t.dataset.ek]=t.value;pDirty=true;pStatus="";return true}
  if(t.dataset.bf){const [i,f]=t.dataset.bf.split(":");pDraft.bireyler[+i][f]=t.value;pDirty=true;pStatus="";return true}
  if(t.dataset.af&&e.type==="change"){aF[t.dataset.af]=t.value;if(t.dataset.af==="blok")aF.kat="";render(false);return true}
  return false;
}

function puanTablosu(t){
  const T={};(t.takimlar||[]).forEach(a=>T[a]={ad:a,o:0,g:0,b:0,m:0,ag:0,yg:0,p:0});
  (t.maclar||[]).forEach(m=>{const a=+m.evS,b=+m.depS;if(m.evS===""||m.depS===""||!Number.isFinite(a)||!Number.isFinite(b)||!T[m.ev]||!T[m.dep])return;
    const E=T[m.ev],D=T[m.dep];E.o++;D.o++;E.ag+=a;E.yg+=b;D.ag+=b;D.yg+=a;if(a>b){E.g++;D.m++;E.p+=3}else if(a<b){D.g++;E.m++;D.p+=3}else{E.b++;D.b++;E.p++;D.p++}});
  return Object.values(T).sort((x,y)=>y.p-x.p||(y.ag-y.yg)-(x.ag-x.yg)||y.ag-x.ag||x.ad.localeCompare(y.ad,"tr"));
}

function gundemSonra(){

async function fotoKucult(file){
  const url=URL.createObjectURL(file);try{const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
  const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85))}finally{URL.revokeObjectURL(url)}
}
async function gnClick(a){

  if(k==="daha"){gnSay+=10;return yen()}

  if(k==="fotokaldir"){gnFoto=null;return yen()}
  if(k==="paylas"){const metin=String(document.getElementById("gnMetin")?.value||"").trim().slice(0,500);if(!metin&&!gnFoto){toast("Bir şey yazın ya da fotoğraf ekleyin");return}
    const pid="g"+Date.now().toString(36),p={metin,foto:gnFoto||"",t:Date.now(),yazar:benimEtiket()};
    const ref=DB.doc("gonderiler/"+UID),sn=await ref.get();if(sn.exists)await ref.update({posts:{[pid]:p}});else await ref.set({posts:{[pid]:p}});
    gnFoto=null;gnStatus="";const ta=document.getElementById("gnMetin");if(ta)ta.value="";toast("Paylaşıldı");return yen()}
  if(k==="begen"){const d=BEG[UID]||{liked:{}},liked={...(d.liked||{})};if(liked[rest])delete liked[rest];else liked[rest]=true;BEG={...BEG,[UID]:{liked}};yen();await DB.doc("begeniler/"+UID).set({liked,guncelleme:Date.now()});return}
  if(k==="yac"){gnYorumAcik[rest]=!gnYorumAcik[rest];return yen()}
  if(k==="yorum"){const inp=document.querySelector(`[data-yz="${CSS.escape(rest)}"]`);const metin=String(inp?.value||"").trim().slice(0,300);if(!metin)return;
    const cid="c"+Date.now().toString(36),c={k:rest,metin,t:Date.now(),yazar:benimEtiket()};const ref=DB.doc("yorumlar/"+UID),sn=await ref.get();
    if(sn.exists)await ref.update({items:{[cid]:c}});else await ref.set({items:{[cid]:c}});if(inp)inp.value="";return}
  if(k==="ysil"){const [uid,cid]=rest.split(":");if(uid===UID){const d=JSON.parse(JSON.stringify(YRM[UID]||{items:{}}));delete d.items[cid];await DB.doc("yorumlar/"+UID).set({items:d.items})}else if(ADMIN)await DB.doc("yorumlar/"+uid).update({items:{[cid]:{gizli:true}}});return}
  if(k==="sil"){const d=JSON.parse(JSON.stringify(GND[UID]||{posts:{}})),p=d.posts[rest];delete d.posts[rest];await DB.doc("gonderiler/"+UID).set({posts:d.posts});
    if(p&&p.foto&&ASSETS)ASSETS.delete(p.foto).catch(()=>{});toast("Gönderi silindi");return}
  if(k==="sabit"||k==="gizle"){if(!ADMIN)return;const [uid,pid]=rest.split(":");const p=GND[uid]?.posts?.[pid];if(!p)return;
    await DB.doc("gonderiler/"+uid).update({posts:{[pid]:k==="sabit"?{sabit:!p.sabit}:{gizli:!p.gizli}}});return}
  }catch(err){toast(err?.code==="invalid_argument"?"Bu işlem için izniniz yok":"İşlem yapılamadı, tekrar deneyin")}
}
async function gnDosya(input){

  if(!b){b=document.createElement("nav");b.id="bnav";b.className="bnav";b.setAttribute("aria-label","Ana menü");document.body.appendChild(b)}
  const items=[["anasayfa","ev","Ana sayfa"],["gundem","mesaj","Gündem"],["sepet","sepet","Sepet"],["hizmet","utu","Hizmet"],["etkinlik","takvim","Etkinlik"],["firsat","etiket","Fırsat"]];
  const cur=current in BY||["kart","projeler","cerceve"].includes(current)?"harita":current==="ayarlar"?"sakinler":current;
  b.innerHTML=items.map(([v,i,l])=>`<a href="#${v}" ${cur===v?'aria-current="page"':""}>${ikon(i)}<span>${l}</span></a>`).join("");
}

let current="anasayfa";
function route(){
  gnSay=10;
  let v=(location.hash||"#anasayfa").slice(1); if(!(v in BY)&&!["anasayfa","bugun","hikmet","hizmet","gundem","harita","profil","sepet","etkinlik","magaza","firsat","kart","projeler","cerceve","sakinler","ayarlar","davetler","arena"].includes(v)) v="anasayfa";
  current=v; render(true);
}
function render(scrollTop){
  const main=document.getElementById("main"),v=current;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v||((v in BY||["kart","projeler","cerceve"].includes(v))&&a.dataset.v==="harita")?"page":"false"));
  bnav();
  if(v==="anasayfa") main.innerHTML=viewAnasayfa();
  else if(v==="harita") main.innerHTML=viewHarita();
  else if(v==="profil"){ const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input:not([type=checkbox])")) return; main.innerHTML=viewProfil(); }
  else if(v==="sakinler") main.innerHTML=(window.BS_YONETIM&&ADMIN?BS_YONETIM.giris():"")+viewSakinler();
  else if(v==="arena") { if(window.BS_ARENA&&BS_ARENA.odakta())return; main.innerHTML=window.BS_ARENA?BS_ARENA.view():`<div class="pending">Arena telefon uygulamasında ve site sunucusunda çalışır.</div>`; }
  else if(v==="davetler") main.innerHTML=window.BS_YONETIM&&ADMIN?BS_YONETIM.view():`<div class="pending">Bu bölüm yalnızca site yönetimine açık.</div>`;
  else if(v==="firsat"||v==="magaza"){ if(v==="magaza"){current="firsat";fSekme="hizmet"} const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input:not([type=checkbox]):not(#frAra),textarea")) return; main.innerHTML=viewFirsat(); }
  else if(v==="hikmet"){ main.innerHTML=viewHikmet(); }
  else if(v==="hizmet"){ const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input:not([type=checkbox]):not([type=radio]),textarea")) return; main.innerHTML=viewHizmet(); }
  else if(v==="bugun"){ const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input")) return; main.innerHTML=viewBugun(); }
  else if(v==="gundem"){ const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input:not([type=checkbox]):not([type=file]),textarea")) return; main.innerHTML=viewGundem(); gundemSonra(); }
  else if(v==="etkinlik"){ const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input:not([type=checkbox]),textarea")) return; main.innerHTML=viewEtkinlikSayfa(); }
  else if(v==="sepet"){ const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input:not([type=checkbox]),textarea")) return; main.innerHTML=viewSepet(); spAra(); }
  else if(v==="ayarlar"){ const ae=document.activeElement; if(!scrollTop&&ae&&main.contains(ae)&&ae.matches("input:not([type=checkbox])")) return; main.innerHTML=viewAyarlar(); }
  else if(v==="kart"){ if(!scrollTop&&document.activeElement?.dataset?.kanit) return; main.innerHTML=viewKart(); }
  else if(scrollTop){ if(v==="projeler") viewDoc("19-site-gorevleri.md","Sitenin gerçek işleri","Site görevleri","Modüller sitenin gerçek bir işinde birleşir. 7 ve üzeri puan yalnızca bu görevlerdeki kanıtla verilir.");
    else if(v==="cerceve") viewDoc("00-ana-cerceve.md","Kurallar","Ana çerçeve","Mimarlık ustalık sisteminden site sakinine uyarlanan puanlama, öğrenme sırası, şablon ve beceri zinciri.");
    else viewModul(v); }
  else if(v in BY){ const sb=document.getElementById("sb"); if(sb){const s=sc(v);sb.innerHTML=`<div class="head" style="display:flex;justify-content:space-between"><span class="eyebrow">Bu modüldeki puanın</span><span class="score ${s?"":"empty"}">${s||"–"}</span></div>${picker(v)}<div class="lvl"><b>${LEVEL(s)}</b> · Sonraki adım: ${NEXT(s)}</div>${warn7(v)}`} }
  if(scrollTop) window.scrollTo(0,0);
}
document.addEventListener("click",async e=>{
  const tg=e.target.closest("[data-tp-go]");if(tg){topMode=tg.dataset.tpGo}
  const kp=e.target.closest("[data-kopya]");if(kp){const el=document.getElementById(kp.dataset.kopya);try{await navigator.clipboard.writeText(el.textContent);toast("Numara kopyalandı")}catch(err){const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast("Numara seçildi, kopyalayabilirsiniz")}return}
  const hkg=e.target.closest("[data-hk-gez]");if(hkg){const v=+hkg.dataset.hkGez;hkOff=v===0?0:hkOff+v;const y=window.scrollY;render(false);window.scrollTo(0,y);return}
  const hkt=e.target.closest("[data-hk-tema]");if(hkt){hkTema=hkt.dataset.hkTema;const y=window.scrollY;render(false);window.scrollTo(0,y);return}
  const hzb=e.target.closest("[data-hz]");if(hzb){hzClick(hzb.dataset.hz);return}
  if(e.target.closest("[data-bgk]")){bugunKaydet();return}
  const frb=e.target.closest("[data-fr]");if(frb){frClick(frb.dataset.fr);return}
  const gnb=e.target.closest("[data-gn]");if(gnb){gnClick(gnb.dataset.gn);return}
  const tpb=e.target.closest("[data-tp]");if(tpb){topClick(tpb.dataset.tp,tpb);return}
  const spb=e.target.closest("[data-sp]");if(spb){sepetClick(spb.dataset.sp);return}
  const ya=e.target.closest("[data-ayact]");if(ya){ayarClick(ya.dataset.ayact);return}
  const pa=e.target.closest("[data-pact]");
  if(pa){const a=pa.dataset.pact;
    if(a==="edit"){pEdit=true;pDraft=null;pStatus="";window.scrollTo(0,0)}
    else if(a==="kart"){pEdit=false;pDirty=false;pDraft=null;pStatus="";window.scrollTo(0,0)}
    else if(a==="add"){pDraft.bireyler.push({yakinlik:"",yas:"",is:""});pDirty=true}
    else if(a.startsWith("del:")){pDraft.bireyler.splice(+a.slice(4),1);pDirty=true}
    else if(a==="save"){saveProfil();return}
    else if(a==="delask")pDelAsk=true; else if(a==="delno")pDelAsk=false; else if(a==="delyes"){delProfil();return}
    const y=window.scrollY;render(false);window.scrollTo(0,y);return}
  const b=e.target.closest("[data-set]");
  if(b){const c=b.dataset.set,v=+b.dataset.v; state.scores[c]=state.scores[c]===v?0:v; if(!state.scores[c]) delete state.scores[c]; queueSave();
    const y=window.scrollY; render(false); window.scrollTo(0,y); return}
  if(e.target.id==="reset"){document.getElementById("resetBox").innerHTML=`<span class="lvl">${M.length} modülün puanı ve kanıtı silinecek.</span><button class="btn danger" type="button" id="resetYes">Evet, sıfırla</button><button class="btn" type="button" id="resetNo">Vazgeç</button>`;return}
  if(e.target.id==="resetYes"){state={scores:{},kanit:{}};queueSave();render(false);return}
  if(e.target.id==="resetNo"){render(false)}
});
document.addEventListener("input",e=>{if(current==="hizmet"&&hzEvent(e))return;if(current==="bugun"){const t=e.target;bgDraft=bgDraft||{konum:{},temkin:{}};if(t.dataset.bg){bgDraft.konum[t.dataset.bg]=t.value;return}if(t.dataset.bt){bgDraft.temkin[t.dataset.bt]=t.value;return}}if(current==="firsat"&&frEvent(e))return;if((current==="etkinlik"||current==="firsat")&&topEvent(e))return;if(current==="sepet"&&sepetEvent(e))return;if(current==="ayarlar"&&ayarEvent(e))return;if(profilEvent(e))return;const c=e.target.dataset?.kanit; if(c){state.kanit[c]=e.target.value; queueSave()}});
document.addEventListener("change",e=>{if(e.target.id==="gnDosya"){gnDosya(e.target);return}if(current==="hizmet"&&hzEvent(e))return;if(current==="firsat"&&(e.target.dataset.frsira||e.target.dataset.ff)){frEvent(e);return}if((current==="etkinlik"||current==="firsat")&&topEvent(e))return;if(current==="sepet"&&sepetEvent(e))return;if(current==="ayarlar"&&ayarEvent(e))return;if(profilEvent(e))return;});
window.addEventListener("hashchange",route);
applyAyar(); route(); initStore();
setInterval(()=>{if(current==="anasayfa"||current==="bugun"){const ae=document.activeElement;if(ae&&ae.matches&&ae.matches("input,textarea,select"))return;const y=window.scrollY;render(false);window.scrollTo(0,y)}},60000);
</script>
